<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Expansion Generator</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="screen-crack" class="screen-crack"></div>
    <div id="cursed-overlay" class="cursed-overlay"></div>
    <!-- Preloader -->
    <div id="preloader">
        <div class="loader-ring"></div>
        <p class="loader-text">準備中...</p>
    </div>

    <!-- Main Container -->
    <div id="app">
        <!-- Input Screen -->
        <div id="input-screen" class="screen active">
            <div class="title-container">
                <h1 class="main-title">
                    <span class="kanji">領域展開</span>
                    <span class="english">DOMAIN EXPANSION</span>
                </h1>
                <p class="subtitle">Create Your Own Cursed Technique</p>
            </div>

            <div class="input-container">
                <label for="domain-name">Name Your Domain</label>
                <input type="text" id="domain-name" placeholder="e.g., Infinite Void" maxlength="50">
                
                <label for="domain-type">Select Domain Type (Multi-Select to Combine)</label>
                <div class="type-selector">
                    <button class="type-btn active" data-type="void">
                        <span class="type-icon">⚫</span>
                        <span class="type-name">Void</span>
                    </button>
                    <button class="type-btn" data-type="flame">
                        <span class="type-icon">🔥</span>
                        <span class="type-name">Flame</span>
                    </button>
                    <button class="type-btn" data-type="ice">
                        <span class="type-icon">❄️</span>
                        <span class="type-name">Ice</span>
                    </button>
                    <button class="type-btn" data-type="shadow">
                        <span class="type-icon">🌑</span>
                        <span class="type-name">Shadow</span>
                    </button>
                    <button class="type-btn" data-type="lightning">
                        <span class="type-icon">⚡</span>
                        <span class="type-name">Lightning</span>
                    </button>
                                        <button class="type-btn" data-type="blood">
                        <span class="type-icon">🩸</span>
                        <span class="type-name">Blood</span>
                    </button>
                    <button class="type-btn" data-type="nature">
                        <span class="type-icon">🌿</span>
                        <span class="type-name">Nature</span>
                    </button>
                    <button class="type-btn" data-type="soul">
                        <span class="type-icon">👻</span>
                        <span class="type-name">Soul</span>
                    </button>
                    <button class="type-btn" data-type="poison">
                        <span class="type-icon">🧪</span>
                        <span class="type-name">Poison</span>
                    </button>
                    <button class="type-btn" data-type="time">
                        <span class="type-icon">⏳</span>
                        <span class="type-name">Time</span>
                    </button>
                    <button class="type-btn" data-type="abyss">
                        <span class="type-icon">🕳️</span>
                        <span class="type-name">Abyss</span>
                    </button>
                    <button class="type-btn" data-type="gravity">
                        <span class="type-icon">🪐</span>
                        <span class="type-name">Gravity</span>
                    </button>
                    <button class="type-btn" data-type="moonlight">
                        <span class="type-icon">🌙</span>
                        <span class="type-name">Moonlight</span>
                    </button>
                    <button class="type-btn" data-type="sun">
                        <span class="type-icon">☀️</span>
                        <span class="type-name">Sun</span>
                    </button>
                    <button class="type-btn" data-type="chaos">
                        <span class="type-icon">🌀</span>
                        <span class="type-name">Chaos</span>
                    </button>
                    <button class="type-btn" data-type="order">
                        <span class="type-icon">⚖️</span>
                        <span class="type-name">Order</span>
                    </button>
                    <button class="type-btn" data-type="zen">
                        <span class="type-icon">⛩️</span>
                        <span class="type-name">Zen</span>
                    </button>
                                        <button class="type-btn" data-type="infinity">
                        <span class="type-icon">♾️</span>
                        <span class="type-name">Infinity</span>
                    </button>
                    <button class="type-btn" data-type="zero">
                        <span class="type-icon">0️⃣</span>
                        <span class="type-name">Zero</span>
                    </button>
                    <button class="type-btn" data-type="decay">
                        <span class="type-icon">💀</span>
                        <span class="type-name">Decay</span>
                    </button>
                    <button class="type-btn" data-type="growth">
                        <span class="type-icon">🌱</span>
                        <span class="type-name">Growth</span>
                    </button>
                    <button class="type-btn" data-type="mirror">
                        <span class="type-icon">🪞</span>
                        <span class="type-name">Mirror</span>
                    </button>
                    <button class="type-btn" data-type="glass">
                        <span class="type-icon">💎</span>
                        <span class="type-name">Glass</span>
                    </button>
                    <button class="type-btn" data-type="sound">
                        <span class="type-icon">🔊</span>
                        <span class="type-name">Sound</span>
                    </button>
                    <button class="type-btn" data-type="vibration">
                        <span class="type-icon">📳</span>
                        <span class="type-name">Vibration</span>
                    </button>
                    <button class="type-btn" data-type="magnetism">
                        <span class="type-icon">🧲</span>
                        <span class="type-name">Magnetism</span>
                    </button>
                    <button class="type-btn" data-type="radiation">
                        <span class="type-icon">☢️</span>
                        <span class="type-name">Radiation</span>
                    </button>
                    <button class="type-btn" data-type="cosmic">
                        <span class="type-icon">🌌</span>
                        <span class="type-name">Cosmic</span>
                    </button>
                </div>

                <button id="expand-btn" class="expand-button">
                    <span class="btn-text">EXPAND</span>
                    <span class="btn-kanji">展開</span>
                </button>
            </div>

            <div class="examples">
                <p class="examples-title">Famous Examples:</p>
                <div class="example-tags">
                    <span class="tag" data-name="Infinite Void" data-type="void">無量空処</span>
                    <span class="tag" data-name="Malevolent Shrine" data-type="shadow">伏魔御廚子</span>
                    <span class="tag" data-name="Coffin of Iron Mountain" data-type="flame">鉄棺陵</span>
                    <span class="tag" data-name="Horizon of the Captivating Skandha" data-type="ice">饕餮玉藻</span>
                    <span class="tag" data-name="Chimera Shadow Garden" data-type="shadow">嵌合暗翳庭</span>
                    <span class="tag" data-name="Self-Embodiment of Perfection" data-type="soul">自閉円頓裹</span>
                    <span class="tag" data-name="Idle Transfiguration" data-type="soul">無為転変</span>
                    <span class="tag" data-name="Deadly Sentencing" data-type="order">誅伏賜死</span>
                </div>
            </div>
        </div>

        <!-- Domain Expansion Screen -->
        <div id="expansion-screen" class="screen">
            <div class="domain-container">
                <div id="technique-mark" class="technique-mark"></div>
                <!-- Particle Canvas -->
                <canvas id="particle-canvas"></canvas>
                
                <!-- Kanji Rain -->
                <div id="kanji-rain"></div>
                
                <!-- Central Domain Symbol -->
                <div class="domain-symbol">
                    <div class="symbol-ring outer"></div>
                    <div class="symbol-ring middle"></div>
                    <div class="symbol-ring inner"></div>
                    <div class="symbol-core"></div>
                </div>

                <!-- Domain Name Display -->
                <div class="domain-name-display">
                    <span class="domain-kanji" id="display-kanji"></span>
                    <span class="domain-name" id="display-name"></span>
                </div>

                <!-- Hand Sign Animation -->
                <div class="hand-sign">
                    <div class="finger-part"></div>
                    <div class="finger-part"></div>
                    <div class="finger-part"></div>
                    <div class="finger-part"></div>
                    <div class="finger-part"></div>
                </div>

                <!-- Cursed Energy Waves -->
                <div class="energy-waves">
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                </div>
            </div>

            <!-- Exit Button -->
            <button id="exit-btn" class="exit-button">
                <span>Exit Domain</span>
                <span class="exit-kanji">解除</span>
            </button>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="expand-sound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2995/2995-preview.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
